python:
  - 3.12
  
packages:
  - numpy

c_stdlib:
  - sysroot                  # [linux]
c_stdlib_version:
  - 2.17    # [linux]

c_compiler:            # [linux]
  - gcc                      # [linux]
cxx_compiler:          # [linux]
  - gxx                      # [linux]
c_compiler_version:    # [linux]
  - 14                       # [linux]
cxx_compiler_version:  # [linux]
  - 14                       # [linux]
libgcc_version:        # [linux]
  - 14.*                     # [linux]
libstdcxx_version:     # [linux]
  - 14.*                     # [linux]


# gfortran pinned like the C/C++ compilers: Fortran .mod files only load
# with the gfortran major that wrote them, and GCC 14 is the channel floor.
fortran_compiler_version:   # [linux]
  - 14                       # [linux]
